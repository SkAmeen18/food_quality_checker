<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Quality Checker | Smart Freshness</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
        }

        /* The Main Layout Wrapper */
        .wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1000px; /* Increased for side-by-side view */
            gap: 40px;
            align-items: flex-start;
        }

        /* Left Side: Analyzer */
        .container {
            flex: 1.2;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Right Side: Sidebar */
        .sidebar {
            flex: 0.8;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 25px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        h1 { font-weight: 800; color: white; margin: 0; font-size: 2.2rem; text-align: center; }
        .subtitle { color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 25px; font-size: 0.9rem; }

        .sidebar h3 { 
            margin: 0 0 15px 0; 
            font-size: 1.2rem; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 10px;
        }

        /* The List on the Right */
        .item-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            overflow-y: auto; 
            max-height: 600px;
        }

        .item-list li { 
            padding: 12px 15px; 
            font-size: 0.9rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255,255,255,0.8);
        }

        .item-list li:hover { 
            background: rgba(255,255,255,0.1); 
            color: white;
            border-radius: 12px;
        }

        .input-group {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; margin-left: 5px;}

        input {
            width: 100%;
            border: none;
            padding: 8px 5px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
        }

        .action-btn {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            margin-top: 10px;
        }

        .action-btn:hover { transform: translateY(-2px); background: #22c55e; }

        .result-card {
            margin-top: 25px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            animation: slideIn 0.4s ease-out;
            text-align: center;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .freshness-banner {
            padding: 15px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .status-safe { background: #dcfce7; color: #15803d; }
        .status-danger { background: #fee2e2; color: #b91c1c; }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px;}
        .grid-item { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #f1f5f9; }
        .val { display: block; font-weight: 800; font-size: 1.1rem; }
        .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

        .hidden { display: none; }

        /* Custom Scrollbar for Sidebar */
        .item-list::-webkit-scrollbar { width: 5px; }
        .item-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Responsive */
        @media (max-width: 850px) {
            .wrapper { flex-direction: column; }
            .sidebar { width: 100%; flex: none; max-height: 300px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h1>Food Quality Checker</h1>
        <p class="subtitle">Quality & Freshness Analyzer</p>

        <div class="input-group">
            <label>Food Item</label>
            <input type="text" id="foodInput" placeholder="Enter food name...">
        </div>

        <div class="input-group">
            <label>Days in Fridge</label>
            <input type="number" id="daysInput" placeholder="0" min="0">
        </div>

        <button class="action-btn" onclick="checkAll()">CHECK SAFETY</button>

        <div id="result" class="result-card hidden">
            <div id="freshnessBanner" class="freshness-banner"></div>
            <h2 id="foodTitle" style="margin: 0; font-size: 1rem; color: #64748b; font-weight: 400;"></h2>
            <div class="grid">
                <div class="grid-item"><span class="lbl">Protein</span><span class="val" id="pVal">0</span></div>
                <div class="grid-item"><span class="lbl">Fiber</span><span class="val" id="fVal">0</span></div>
                <div class="grid-item"><span class="lbl">Sodium</span><span class="val" id="sVal">0</span></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h3>Food Items</h3>
        <ul class="item-list" id="itemList">
            </ul>
    </div>
</div>

<script>
    const storageDatabase = {
        "Hummus, commercial": 5,
        "Tomatoes, grape, raw": 7,
        "Beans, snap, green, canned": 4,
        "Frankfurter, beef, unheated": 7,
        "Nuts, almonds, dry roasted": 30,
        "Kale, raw": 5,
        "Egg, whole, raw, pasteurized": 3,
        "Egg, white, raw, pasteurized": 3,
        "Egg, white, dried": 365,
        "Onion rings, frozen": 3,
        "Pickles, cucumber": 30,
        "Cheese, parmesan, grated": 21,
        "Cheese, American": 14,
        "Grapefruit juice": 7,
        "Peaches, yellow, raw": 5,
        "Seeds, sunflower seed": 30,
        "Bread, white": 7,
        "Kale, frozen, cooked": 4,
        "Mustard, prepared": 60,
        "Kiwifruit, green, raw": 7,
        "Yogurt, Greek, nonfat": 7,
        "Yogurt, plain, nonfat": 7,
        "Cheese, monterey jack": 14,
        "Cauliflower, raw": 5,
        "Rice, red, raw": 30,
        "Sorghum bran": 30,
        "Parsnips, raw": 10,
        "Peppers, banana, raw": 7,
        "Swordfish, frozen": 2,
        "Watermelon, rind only, raw": 4
    };

    const listElement = document.getElementById('itemList');
    Object.keys(storageDatabase).forEach(item => {
        let li = document.createElement('li');
        li.innerText = item;
        li.onclick = () => { 
            document.getElementById('foodInput').value = item;
            checkAll(); // Auto-check when clicking item
        };
        listElement.appendChild(li);
    });

    async function checkAll() {
        const query = document.getElementById('foodInput').value.trim().toLowerCase();
        const days = parseInt(document.getElementById('daysInput').value) || 0;
        const resultDiv = document.getElementById('result');

        if (!query) return;

        try {
            const response = await fetch('FoodData_Central_foundation_food_json_2025-12-18.json');
            const data = await response.json();
            const food = data.FoundationFoods.find(item => 
                item.description.toLowerCase().includes(query.split(',')[0].trim())
            );

            if (!food) return alert("Food not found in database.");

            const getNut = (name) => {
                const n = food.foodNutrients.find(nu => nu.nutrient.name.includes(name));
                return n ? Math.round(n.amount) : 0;
            };

            let maxDays = 5; 
            for (let key in storageDatabase) {
                if (food.description.toLowerCase().includes(key.toLowerCase().split(',')[0])) {
                    maxDays = storageDatabase[key];
                    break;
                }
            }

            const isSafe = days <= maxDays;

            document.getElementById('foodTitle').innerText = food.description;
            document.getElementById('pVal').innerText = getNut("Protein") + "g";
            document.getElementById('fVal').innerText = getNut("Fiber") + "g";
            document.getElementById('sVal').innerText = getNut("Sodium") + "mg";

            const banner = document.getElementById('freshnessBanner');
            if (isSafe) {
                banner.className = "freshness-banner status-safe";
                banner.innerText = "SAFE TO EAT";
            } else {
                banner.className = "freshness-banner status-danger";
                banner.innerText = "NOT SAFE TO EAT";
            }

            resultDiv.classList.remove('hidden');
        } catch (e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
