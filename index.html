<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPulse AI | Freshness & Quality</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.98);
            --fresh: #10b981;
            --expired: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-weight: 800; color: white; margin: 0; font-size: 2.2rem; text-align: center; }
        .subtitle { color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 25px; font-size: 0.9rem; }

        .input-group {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; margin-left: 5px;}

        input {
            width: 100%;
            border: none;
            padding: 8px 5px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
        }

        .action-btn {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            margin-top: 10px;
        }

        .action-btn:hover { transform: translateY(-2px); background: #22c55e; }

        /* Results */
        .result-card {
            margin-top: 25px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .freshness-banner {
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-safe { background: #dcfce7; color: #15803d; border: 1px solid #bdf4d4; }
        .status-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-item { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #f1f5f9; }
        .val {font-weight: 800; font-size: 1.1rem; }
        .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>NutriPulse</h1>
    <p class="subtitle">Quality & Freshness Analyzer</p>

    <div class="input-group">
        <label>Food Item</label>
        <input type="text" id="foodInput" placeholder="e.g. Chicken, Spinach, Beef">
    </div>

    <div class="input-group">
        <label>Days in Fridge</label>
        <input type="number" id="daysInput" placeholder="0" min="0">
    </div>

    <button class="action-btn" onclick="checkAll()">Check Safety & Quality</button>

    <div id="result" class="result-card hidden">
        <div id="freshnessBanner" class="freshness-banner"></div>
        
        <h2 id="foodTitle" style="margin: 0 0 15px 0; font-size: 1.3rem;"></h2>

        <div class="grid">
            <div class="grid-item">
                <span class="lbl">Protein</span>
                <span class="val" id="pVal">0</span>
            </div>
            <div class="grid-item">
                <span class="lbl">Fiber</span>
                <span class="val" id="fVal">0</span>
            </div>
            <div class="grid-item">
                <span class="lbl">Sodium</span>
                <span class="val" id="sVal">0</span>
            </div>
        </div>

        <p id="safetyText" style="margin-top: 15px; font-size: 0.85rem; color: #475569; line-height: 1.5;"></p>
    </div>
</div>

<script>
    async function checkAll() {
        const query = document.getElementById('foodInput').value.trim();
        const days = parseInt(document.getElementById('daysInput').value) || 0;
        const resultDiv = document.getElementById('result');

        if (!query) return alert("Enter food name");

        try {
            const response = await fetch('FoodData_Central_foundation_food_json_2025-12-18.json');
            const data = await response.json();
            const food = data.FoundationFoods.find(item => 
                item.description.toLowerCase().includes(query.toLowerCase())
            );

            if (!food) return alert("Food not found in USDA database.");

            // 1. Get Nutrients
            const getNut = (name) => {
                const n = food.foodNutrients.find(nu => nu.nutrient.name.includes(name));
                return n ? Math.round(n.amount) : 0;
            };

            // 2. Freshness Logic
            let maxDays = 5; // Default for veggies/others
            const desc = food.description.toLowerCase();
            
            if (desc.includes('chicken') || desc.includes('beef') || desc.includes('fish') || desc.includes('pork') || desc.includes('meat')) {
                maxDays = 3; // Meats spoil faster
            } else if (desc.includes('milk') || desc.includes('yogurt') || desc.includes('egg')) {
                maxDays = 7;
            }

            const isSafe = days <= maxDays;

            // 3. Update UI
            document.getElementById('foodTitle').innerText = food.description;
            document.getElementById('pVal').innerText = getNut("Protein") + "g";
            document.getElementById('fVal').innerText = getNut("Fiber") + "g";
            document.getElementById('sVal').innerText = getNut("Sodium") + "mg";

            const banner = document.getElementById('freshnessBanner');
            const safetyText = document.getElementById('safetyText');

            if (isSafe) {
                banner.className = "freshness-banner status-safe";
                banner.innerHTML = "✅ FRESH & EATABLE";
                safetyText.innerHTML = `This ${query} is still within the safe window (${days}/${maxDays} days). Storage conditions: Keep at 4°C.`;
            } else {
                banner.className = "freshness-banner status-danger";
                banner.innerHTML = "⚠️ EXPIRED / UNSAFE";
                safetyText.innerHTML = `<b>Warning:</b> Most ${query} items spoil after ${maxDays} days. Consumption is not recommended due to bacterial risk.`;
            }

            resultDiv.classList.remove('hidden');
        } catch (e) {
            alert("Database Error: Ensure the JSON file is in the same folder.");
        }
    }
</script>
</body>
</html>
