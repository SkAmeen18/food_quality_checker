<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Quality Checker | Smart Freshness</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
            box-sizing: border-box;
        }

        /* The Main Layout Wrapper */
        .wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1000px;
            gap: 40px;
            align-items: flex-start;
        }

        /* Left Side: Analyzer */
        .container {
            flex: 1.2;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        /* Right Side: Sidebar */
        .sidebar {
            flex: 0.8;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 25px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; color: white; margin: 0; font-size: 2.2rem; text-align: center; }
        .subtitle { color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 25px; font-size: 0.9rem; }

        .sidebar h3 { 
            margin: 0 0 15px 0; 
            font-size: 1.2rem; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 10px;
        }

        /* The List on the Right */
        .item-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            overflow-y: auto; 
            max-height: 600px;
        }

        .item-list li { 
            padding: 12px 15px; 
            font-size: 0.9rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255,255,255,0.8);
        }

        .item-list li:hover { 
            background: rgba(255,255,255,0.1); 
            color: white;
            border-radius: 12px;
        }

        .input-group {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; margin-left: 5px;}

        input, select {
            width: 100%;
            border: none;
            padding: 8px 5px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
            background: transparent;
            color: #1a202c;
            box-sizing: border-box;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            margin-top: 10px;
        }

        .action-btn:hover { transform: translateY(-2px); background: #22c55e; }
        .action-btn:disabled { background: #64748b; cursor: not-allowed; transform: none; }

        .result-card {
            margin-top: 25px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            animation: slideIn 0.4s ease-out;
            text-align: center;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .freshness-banner {
            padding: 15px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .status-safe { background: #dcfce7; color: #15803d; }
        .status-danger { background: #fee2e2; color: #b91c1c; }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px;}
        .grid-item { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #f1f5f9; }
        .val { display: block; font-weight: 800; font-size: 1.1rem; }
        .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

        .hidden { display: none; }

        /* Custom Scrollbar for Sidebar */
        .item-list::-webkit-scrollbar { width: 5px; }
        .item-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Responsive */
        @media (max-width: 850px) {
            .wrapper { flex-direction: column; }
            .sidebar { width: 100%; flex: none; max-height: 300px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h1>Food Quality Checker</h1>
        <p class="subtitle">Quality & Freshness Analyzer</p>

        <div class="input-group">
            <label for="foodInput">Food Item</label>
            <input type="text" id="foodInput" placeholder="Enter food name...">
        </div>

        <div class="input-group">
            <label for="foodType">Food Type / Preparation</label>
            <select id="foodType">
                <option value="raw">Raw / Fresh</option>
                <option value="cooked">Cooked</option>
                <option value="commercial">Commercial / Prepared</option>
                <option value="canned">Canned</option>
                <option value="frozen">Frozen</option>
                <option value="pasteurized">Pasteurized</option>
                <option value="dried">Dried / Roasted</option>
            </select>
        </div>

        <div class="input-group">
            <label for="daysInput">Days in Fridge</label>
            <input type="number" id="daysInput" placeholder="0" min="0">
        </div>

        <button class="action-btn" id="checkBtn" onclick="checkAll()">CHECK SAFETY</button>

        <div id="result" class="result-card hidden">
            <div id="freshnessBanner" class="freshness-banner"></div>
            <h2 id="foodTitle" style="margin: 0; font-size: 1rem; color: #64748b; font-weight: 400;"></h2>
            <div class="grid">
                <div class="grid-item"><span class="lbl">Protein</span><span class="val" id="pVal">0g</span></div>
                <div class="grid-item"><span class="lbl">Fiber</span><span class="val" id="fVal">0g</span></div>
                <div class="grid-item"><span class="lbl">Sodium</span><span class="val" id="sVal">0mg</span></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h3>Food Items</h3>
        <ul class="item-list" id="itemList"></ul>
    </div>
</div>

<script>
    const storageDatabase = {
        "Hummus, commercial": { days: 5, type: "commercial" },
        "Tomatoes, grape, raw": { days: 7, type: "raw" },
        "Beans, snap, green, canned": { days: 4, type: "canned" },
        "Frankfurter, beef, unheated": { days: 7, type: "commercial" },
        "Nuts, almonds, dry roasted": { days: 30, type: "dried" },
        "Kale, raw": { days: 5, type: "raw" },
        "Egg, whole, raw, pasteurized": { days: 3, type: "pasteurized" },
        "Egg, white, raw, pasteurized": { days: 3, type: "pasteurized" },
        "Egg, white, dried": { days: 365, type: "dried" },
        "Onion rings, frozen": { days: 3, type: "frozen" },
        "Pickles, cucumber": { days: 30, type: "commercial" },
        "Cheese, parmesan, grated": { days: 21, type: "commercial" },
        "Cheese, American": { days: 14, type: "commercial" },
        "Grapefruit juice": { days: 7, type: "raw" },
        "Peaches, yellow, raw": { days: 5, type: "raw" },
        "Seeds, sunflower seed": { days: 30, type: "dried" },
        "Bread, white": { days: 7, type: "commercial" },
        "Kale, frozen, cooked": { days: 4, type: "cooked" },
        "Mustard, prepared": { days: 60, type: "commercial" },
        "Kiwifruit, green, raw": { days: 7, type: "raw" },
        "Yogurt, Greek, nonfat": { days: 7, type: "commercial" },
        "Yogurt, plain, nonfat": { days: 7, type: "commercial" },
        "Cheese, monterey jack": { days: 14, type: "commercial" },
        "Cauliflower, raw": { days: 5, type: "raw" },
        "Rice, red, raw": { days: 30, type: "raw" },
        "Sorghum bran": { days: 30, type: "dried" },
        "Parsnips, raw": { days: 10, type: "raw" },
        "Peppers, banana, raw": { days: 7, type: "raw" },
        "Swordfish, frozen": { days: 2, type: "frozen" },
        "Watermelon, rind only, raw": { days: 4, type: "raw" }
    };

    // Helper function to extract ONLY the clean food name
    function getCleanFoodName(fullKey) {
        // Known prep words to filter out if appended to commas
        const filterWords = ['raw', 'cooked', 'canned', 'frozen', 'pasteurized', 'dried', 'commercial', 'unheated', 'prepared'];
        const parts = fullKey.split(',').map(p => p.trim());
        
        // Keep parts that are not preparation descriptor words
        const cleanParts = parts.filter(part => !filterWords.includes(part.toLowerCase()));
        
        return cleanParts.join(', ');
    }

    // Populate Sidebar with Clean Names
    const listElement = document.getElementById('itemList');
    Object.keys(storageDatabase).forEach(itemKey => {
        const displayName = getCleanFoodName(itemKey);

        let li = document.createElement('li');
        li.innerText = displayName; // Displays ONLY clean food name
        
        li.onclick = () => { 
            // Auto-fill input with the clean food name
            document.getElementById('foodInput').value = displayName;
            
            // Auto-select type based on item data
            const itemData = storageDatabase[itemKey];
            if (itemData && itemData.type) {
                document.getElementById('foodType').value = itemData.type;
            }
            
            checkAll(); 
        };
        listElement.appendChild(li);
    });

    async function checkAll() {
        const queryName = document.getElementById('foodInput').value.trim();
        const selectedType = document.getElementById('foodType').value;
        const days = parseInt(document.getElementById('daysInput').value) || 0;
        const resultDiv = document.getElementById('result');
        const checkBtn = document.getElementById('checkBtn');

        if (!queryName) {
            alert("Please enter a food name.");
            return;
        }

        // Combine food name with selected type for targeted search
        const fullSearchQuery = `${queryName} ${selectedType}`;

        // UI Loading state
        checkBtn.innerText = "SEARCHING...";
        checkBtn.disabled = true;

        try {
            // Live fetch from official USDA FoodData Central REST API
            const API_KEY = 'DEMO_KEY';
            const response = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(fullSearchQuery)}&pageSize=5&api_key=${API_KEY}`);
            
            if (!response.ok) throw new Error("API Request failed");

            const data = await response.json();

            if (!data.foods || data.foods.length === 0) {
                alert("Food item not found in USDA database.");
                return;
            }

            const food = data.foods[0]; // Take best matching item

            // Helper to extract nutrient by name safely
            const getNut = (nutrientName) => {
                if (!food.foodNutrients) return 0;
                const n = food.foodNutrients.find(nu => 
                    nu.nutrientName && nu.nutrientName.toLowerCase().includes(nutrientName.toLowerCase())
                );
                return n ? Math.round(n.value) : 0;
            };

            // Calculate max shelf life
            let maxDays = 5; // Default safe estimate
            const cleanQuery = queryName.toLowerCase();

            for (let key in storageDatabase) {
                const primaryTerm = key.toLowerCase().split(',')[0].trim();
                if (cleanQuery.includes(primaryTerm) || primaryTerm.includes(cleanQuery)) {
                    maxDays = storageDatabase[key].days;
                    break;
                }
            }

            const isSafe = days <= maxDays;

            // Update UI elements
            document.getElementById('foodTitle').innerText = food.description;
            document.getElementById('pVal').innerText = getNut("Protein") + "g";
            document.getElementById('fVal').innerText = getNut("Fiber") + "g";
            document.getElementById('sVal').innerText = getNut("Sodium") + "mg";

            const banner = document.getElementById('freshnessBanner');
            if (isSafe) {
                banner.className = "freshness-banner status-safe";
                banner.innerText = "SAFE TO EAT";
            } else {
                banner.className = "freshness-banner status-danger";
                banner.innerText = "NOT SAFE TO EAT";
            }

            resultDiv.classList.remove('hidden');

        } catch (e) {
            console.error(e);
            alert("An error occurred while checking food safety. Please check your network connection.");
        } finally {
            checkBtn.innerText = "CHECK SAFETY";
            checkBtn.disabled = false;
        }
    }
</script>
</body>
</html>
