<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Quality Checker | Smart Freshness</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
            box-sizing: border-box;
        }

        /* The Main Layout Wrapper */
        .wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1000px;
            gap: 40px;
            align-items: flex-start;
        }

        /* Left Side: Analyzer */
        .container {
            flex: 1.2;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        /* Right Side: Sidebar */
        .sidebar {
            flex: 0.8;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 25px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h1 { font-weight: 800; color: white; margin: 0; font-size: 2.2rem; text-align: center; }
        .subtitle { color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 25px; font-size: 0.9rem; }

        .sidebar h3 { 
            margin: 0 0 15px 0; 
            font-size: 1.2rem; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 10px;
        }

        /* The List on the Right */
        .item-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            overflow-y: auto; 
            max-height: 600px;
        }

        .item-list li { 
            padding: 12px 15px; 
            font-size: 0.9rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255,255,255,0.8);
        }

        .item-list li:hover { 
            background: rgba(255,255,255,0.1); 
            color: white;
            border-radius: 12px;
        }

        .input-group {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; margin-left: 5px;}

        input, select {
            width: 100%;
            border: none;
            padding: 8px 5px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
            background: transparent;
            color: #1a202c;
            box-sizing: border-box;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            margin-top: 10px;
        }

        .action-btn:hover { transform: translateY(-2px); background: #22c55e; }

        .result-card {
            margin-top: 25px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            animation: slideIn 0.4s ease-out;
            text-align: center;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .freshness-banner {
            padding: 15px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .status-safe { background: #dcfce7; color: #15803d; }
        .status-danger { background: #fee2e2; color: #b91c1c; }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px;}
        .grid-item { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #f1f5f9; }
        .val { display: block; font-weight: 800; font-size: 1.1rem; }
        .lbl { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

        .hidden { display: none; }

        /* Custom Scrollbar for Sidebar */
        .item-list::-webkit-scrollbar { width: 5px; }
        .item-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Responsive */
        @media (max-width: 850px) {
            .wrapper { flex-direction: column; }
            .sidebar { width: 100%; flex: none; max-height: 300px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h1>Food Quality Checker</h1>
        <p class="subtitle">Quality & Freshness Analyzer</p>

        <div class="input-group">
            <label for="foodInput">Food Item</label>
            <input type="text" id="foodInput" placeholder="Enter food name...">
        </div>

        <div class="input-group">
            <label for="foodType">Food Type / Preparation</label>
            <select id="foodType">
                <option value="raw">Raw / Fresh</option>
                <option value="cooked">Cooked</option>
                <option value="commercial">Commercial / Prepared</option>
                <option value="canned">Canned</option>
                <option value="frozen">Frozen</option>
                <option value="pasteurized">Pasteurized</option>
                <option value="dried">Dried / Roasted</option>
            </select>
        </div>

        <div class="input-group">
            <label for="daysInput">Days in Fridge</label>
            <input type="number" id="daysInput" placeholder="0" min="0">
        </div>

        <button class="action-btn" id="checkBtn" onclick="checkAll()">CHECK SAFETY</button>

        <div id="result" class="result-card hidden">
            <div id="freshnessBanner" class="freshness-banner"></div>
            <h2 id="foodTitle" style="margin: 0; font-size: 1rem; color: #64748b; font-weight: 400;"></h2>
            <div class="grid">
                <div class="grid-item"><span class="lbl">Protein</span><span class="val" id="pVal">0g</span></div>
                <div class="grid-item"><span class="lbl">Fiber</span><span class="val" id="fVal">0g</span></div>
                <div class="grid-item"><span class="lbl">Sodium</span><span class="val" id="sVal">0mg</span></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h3>Food Items</h3>
        <ul class="item-list" id="itemList"></ul>
    </div>
</div>

<script>
    // Local standalone database (No API or key required)
    const storageDatabase = {
        "Hummus, commercial": { days: 5, type: "commercial", protein: 8, fiber: 6, sodium: 380 },
        "Tomatoes, grape, raw": { days: 7, type: "raw", protein: 1, fiber: 1, sodium: 5 },
        "Beans, snap, green, canned": { days: 4, type: "canned", protein: 1, fiber: 2, sodium: 290 },
        "Frankfurter, beef, unheated": { days: 7, type: "commercial", protein: 12, fiber: 0, sodium: 560 },
        "Nuts, almonds, dry roasted": { days: 30, type: "dried", protein: 21, fiber: 11, sodium: 1 },
        "Kale, raw": { days: 5, type: "raw", protein: 3, fiber: 4, sodium: 38 },
        "Egg, whole, raw, pasteurized": { days: 3, type: "pasteurized", protein: 13, fiber: 0, sodium: 140 },
        "Egg, white, raw, pasteurized": { days: 3, type: "pasteurized", protein: 11, fiber: 0, sodium: 166 },
        "Egg, white, dried": { days: 365, type: "dried", protein: 81, fiber: 0, sodium: 1240 },
        "Onion rings, frozen": { days: 3, type: "frozen", protein: 3, fiber: 2, sodium: 320 },
        "Pickles, cucumber": { days: 30, type: "commercial", protein: 0, fiber: 1, sodium: 800 },
        "Cheese, parmesan, grated": { days: 21, type: "commercial", protein: 38, fiber: 0, sodium: 1529 },
        "Cheese, American": { days: 14, type: "commercial", protein: 18, fiber: 0, sodium: 1200 },
        "Grapefruit juice": { days: 7, type: "raw", protein: 1, fiber: 0, sodium: 2 },
        "Peaches, yellow, raw": { days: 5, type: "raw", protein: 1, fiber: 2, sodium: 0 },
        "Seeds, sunflower seed": { days: 30, type: "dried", protein: 21, fiber: 9, sodium: 9 },
        "Bread, white": { days: 7, type: "commercial", protein: 9, fiber: 3, sodium: 490 },
        "Kale, frozen, cooked": { days: 4, type: "cooked", protein: 3, fiber: 3, sodium: 22 },
        "Mustard, prepared": { days: 60, type: "commercial", protein: 4, fiber: 3, sodium: 1100 },
        "Kiwifruit, green, raw": { days: 7, type: "raw", protein: 1, fiber: 3, sodium: 3 },
        "Yogurt, Greek, nonfat": { days: 7, type: "commercial", protein: 10, fiber: 0, sodium: 36 },
        "Yogurt, plain, nonfat": { days: 7, type: "commercial", protein: 6, fiber: 0, sodium: 52 },
        "Cheese, monterey jack": { days: 14, type: "commercial", protein: 25, fiber: 0, sodium: 540 },
        "Cauliflower, raw": { days: 5, type: "raw", protein: 2, fiber: 2, sodium: 30 },
        "Rice, red, raw": { days: 30, type: "raw", protein: 7, fiber: 4, sodium: 5 },
        "Sorghum bran": { days: 30, type: "dried", protein: 11, fiber: 67, sodium: 6 },
        "Parsnips, raw": { days: 10, type: "raw", protein: 1, fiber: 5, sodium: 10 },
        "Peppers, banana, raw": { days: 7, type: "raw", protein: 2, fiber: 3, sodium: 13 },
        "Swordfish, frozen": { days: 2, type: "frozen", protein: 20, fiber: 0, sodium: 90 },
        "Watermelon, rind only, raw": { days: 4, type: "raw", protein: 1, fiber: 1, sodium: 2 }
    };

    // Helper function to extract ONLY clean food name for the list display
    function getCleanFoodName(fullKey) {
        const filterWords = ['raw', 'cooked', 'canned', 'frozen', 'pasteurized', 'dried', 'commercial', 'unheated', 'prepared'];
        const parts = fullKey.split(',').map(p => p.trim());
        const cleanParts = parts.filter(part => !filterWords.includes(part.toLowerCase()));
        return cleanParts.join(', ');
    }

    // Populate Sidebar
    const listElement = document.getElementById('itemList');
    Object.keys(storageDatabase).forEach(itemKey => {
        const displayName = getCleanFoodName(itemKey);

        let li = document.createElement('li');
        li.innerText = displayName; 
        
        li.onclick = () => { 
            document.getElementById('foodInput').value = displayName;
            const itemData = storageDatabase[itemKey];
            if (itemData && itemData.type) {
                document.getElementById('foodType').value = itemData.type;
            }
            checkAll(); 
        };
        listElement.appendChild(li);
    });

    function checkAll() {
        const queryName = document.getElementById('foodInput').value.trim().toLowerCase();
        const days = parseInt(document.getElementById('daysInput').value) || 0;
        const resultDiv = document.getElementById('result');

        if (!queryName) {
            alert("Please enter a food name.");
            return;
        }

        // Find match in local storage
        let matchedKey = null;
        for (let key in storageDatabase) {
            const primaryTerm = key.toLowerCase().split(',')[0].trim();
            if (queryName.includes(primaryTerm) || primaryTerm.includes(queryName)) {
                matchedKey = key;
                break;
            }
        }

        if (!matchedKey) {
            alert("Food item not found in local database. Try selecting one from the sidebar list!");
            return;
        }

        const foodData = storageDatabase[matchedKey];
        const isSafe = days <= foodData.days;

        // Update UI
        document.getElementById('foodTitle').innerText = matchedKey;
        document.getElementById('pVal').innerText = foodData.protein + "g";
        document.getElementById('fVal').innerText = foodData.fiber + "g";
        document.getElementById('sVal').innerText = foodData.sodium + "mg";

        const banner = document.getElementById('freshnessBanner');
        if (isSafe) {
            banner.className = "freshness-banner status-safe";
            banner.innerText = "SAFE TO EAT";
        } else {
            banner.className = "freshness-banner status-danger";
            banner.innerText = "NOT SAFE TO EAT";
        }

        resultDiv.classList.remove('hidden');
    }
</script>
</body>
</html>
