<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScan | Advanced Food Quality Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }

        h1 {
            color: #1e1b4b;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #6366f1;
            margin-bottom: 30px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .search-area {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid transparent;
            background: white;
            border-radius: 14px;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }

        button:active { transform: translateY(0); }

        /* Result Card Styling */
        .result-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-top: 30px;
            text-align: left;
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .good { background: #dcfce7; color: var(--success); }
        .poor { background: #fee2e2; color: var(--danger); }
        .neutral { background: #fef3c7; color: var(--warning); }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-box label {
            display: block;
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .stat-box span {
            font-weight: 700;
            color: #1e293b;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NutriScan</h1>
        <p class="subtitle">USDA Database Analysis</p>

        <div class="search-area">
            <input type="text" id="foodInput" placeholder="Search (e.g., Apple, Hummus)">
            <button id="checkBtn" onclick="checkFoodQuality()">Analyze Nutrition</button>
        </div>

        <div id="result" class="result-card hidden">
            <div id="qualityBadge" class="badge"></div>
            <h2 id="foodTitle" style="margin: 0 0 15px 0; font-size: 1.25rem;"></h2>
            
            <div class="stat-grid">
                <div class="stat-box">
                    <label>Protein</label>
                    <span id="pVal">0</span><small>g</small>
                </div>
                <div class="stat-box">
                    <label>Fiber</label>
                    <span id="fVal">0</span><small>g</small>
                </div>
                <div class="stat-box">
                    <label>Sodium</label>
                    <span id="sVal">0</span><small>mg</small>
                </div>
            </div>
            
            <p id="feedback" style="font-size: 0.9rem; line-height: 1.5; color: #475569; border-left: 3px solid #e2e8f0; padding-left: 15px;"></p>
        </div>
    </div>

    <script>
        async function checkFoodQuality() {
            const query = document.getElementById('foodInput').value.toLowerCase().trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('checkBtn');

            if (!query) return;

            // Simple loading state
            btn.innerText = "Searching...";
            btn.disabled = true;

            try {
                // Same Fetch Logic as your original
                const response = await fetch('FoodData_Central_foundation_food_json_2025-12-18.json');
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                const food = data.FoundationFoods.find(item => 
                    item.description.toLowerCase().includes(query)
                );

                if (!food) {
                    alert("Food not found in database.");
                } else {
                    const findNutrient = (name) => {
                        const found = food.foodNutrients.find(n => n.nutrient.name.includes(name));
                        return found ? found.amount : 0;
                    };

                    displayResults(
                        food.description, 
                        findNutrient("Protein"), 
                        findNutrient("Fiber"), 
                        findNutrient("Sodium")
                    );
                    resultDiv.classList.remove('hidden');
                }
            } catch (err) {
                alert("Error connecting to dataset.");
            } finally {
                btn.innerText = "Analyze Nutrition";
                btn.disabled = false;
            }
        }

        function displayResults(name, p, f, s) {
            document.getElementById('foodTitle').innerText = name;
            document.getElementById('pVal').innerText = p;
            document.getElementById('fVal').innerText = f;
            document.getElementById('sVal').innerText = s;

            const badge = document.getElementById('qualityBadge');
            const feedback = document.getElementById('feedback');

            if (p > 5 || f > 4) {
                badge.innerText = "High Quality";
                badge.className = "badge good";
                feedback.innerText = "This food is nutrient-dense and highly recommended for a balanced diet.";
            } else if (s > 500) {
                badge.innerText = "Low Quality";
                badge.className = "badge poor";
                feedback.innerText = "Warning: High sodium levels detected. Excessive intake may impact cardiovascular health.";
            } else {
                badge.innerText = "Moderate";
                badge.className = "badge neutral";
                feedback.innerText = "Standard nutritional values. A safe choice for daily consumption.";
            }
        }
    </script>
</body>
</html>
